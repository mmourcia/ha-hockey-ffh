<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey FFH – Tableau de bord</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#14212e;--mute:#66788a;--line:#e1e8ef;--brand:#0b2a4a;--acc:#1f9d55;--accbg:#e8f6ee;--warn:#c2410c;--warnbg:#fdecd8;--err:#d92d20;--errbg:#fde8e6}
@media(prefers-color-scheme:dark){:root{--bg:#0a1520;--card:#122232;--ink:#e8eef4;--mute:#92a4b6;--line:#1f3347;--acc:#35c47a;--accbg:#12352a;--warn:#fb923c;--warnbg:#3a2412;--err:#f87171;--errbg:#3b1717}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#0b2a4a,#14538f);color:#fff;border-radius:18px;padding:20px 22px}
header h1{margin:0;font-size:22px}header .sub{opacity:.8;font-size:13px}.grow{flex:1;min-width:200px}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;background:var(--accbg);color:var(--acc)}
.badge i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.badge.late{background:var(--warnbg);color:var(--warn)}.badge.error{background:var(--errbg);color:var(--err)}.badge.init{background:var(--line);color:var(--mute)}
.badge.spin i{animation:p 1s infinite}@keyframes p{50%{opacity:.2}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}.tile span{color:var(--mute);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.row:first-of-type{border-top:0}
.row .k{color:var(--mute)}.row .v{text-align:right;min-width:0;overflow-wrap:anywhere}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--acc)}.dot.bad{background:var(--err)}
a.link{color:var(--acc);text-decoration:none;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-top:1px solid var(--line)}th{color:var(--mute);font-weight:600;border-top:0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}.bar>div{height:100%;background:var(--acc)}
.muted{color:var(--mute)}.small{font-size:12px}.empty{color:var(--mute);font-size:14px;padding:6px 0}
.full{grid-column:1/-1}
.tabs{display:flex;gap:6px;margin:16px 0 4px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.spark{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:6px}.spark div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}.spark-l{display:flex;gap:4px;font-size:10px;color:var(--mute)}.spark-l span{flex:1;text-align:center}
.pill{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:999px;padding:1px 8px;font-size:12px;margin:1px 2px 1px 0}.live{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="font-size:38px">🏑</div>
    <div class="grow"><h1>Hockey FFH – Résultats</h1><div class="sub" id="sub">Chargement…</div><div class="sub" id="syncline" style="margin-top:2px"></div></div>
    <span class="badge init" id="badge"><i></i><span>…</span></span>
  </header>
  <div class="tabs"><button class="tab on" data-tab="state">🛠 État</button><button class="tab" data-tab="usage">📈 Fréquentation</button><button class="tab" data-tab="live">💬 Saisies en direct</button></div>
  <div id="pState">
  <div class="actions" id="actions"></div>
  <div class="grid" id="tiles"></div>
  <div class="cols" id="cols"></div>
  </div>
  <div id="pUsage" hidden></div>
  <div id="pLive" hidden></div>
</div>
<script>
const base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const $ = (s) => document.querySelector(s);
const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (iso) => { if (!iso) return '—'; const s = Math.round((Date.now() - Date.parse(iso)) / 1000); if (s < 0) return 'dans ' + dur(-s); return s < 5 ? 'à l’instant' : 'il y a ' + dur(s); };
const dur = (s) => s < 60 ? s + ' s' : s < 3600 ? Math.round(s / 60) + ' min' : s < 86400 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' j';
const dt = (iso) => iso ? new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
const row = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const ms = (p) => `<span class="dot ${p.ok ? '' : 'bad'}"></span>${p.ok ? 'OK' : 'Injoignable'} · ${p.ms} ms`;
const LABEL = { ok: 'Synchronisation OK', late: 'Synchronisation en retard', error: 'Dernière synchro en erreur', init: 'Démarrage…' };
async function post(p) { try { await fetch(base + p, { method: 'POST' }); } catch {} setTimeout(load, 1500); }
async function load() {
  let s; try { s = await (await fetch(base + 'status', { cache: 'no-store' })).json(); } catch { $('#sub').textContent = 'Add-on injoignable'; return; }
  $('#sub').textContent = `Version ${s.version} · saison ${s.seasonLabel || '—'} · actif depuis ${dur(s.uptimeSec)}`;
  const when = (iso) => { const d = new Date(iso), t = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }), same = d.toDateString() === new Date().toDateString(); return same ? t : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + t; };
  const MODE = { live: '🟢 match en cours', soon: '🟡 match dans moins de 3 h', today: '🟡 match dans les 24 h', idle: '⚪ aucun match proche' };
  $('#syncline').innerHTML = s.nextSync ? `🔄 Prochaine synchro prévue <b>${s.refreshing ? 'en cours…' : ago(s.nextSync)}</b> <span class="muted">(${when(s.nextSync)}${s.syncMode ? ' · ' + MODE[s.syncMode] : ''})</span>` : '';
  const b = $('#badge'); b.className = 'badge ' + s.state + (s.refreshing ? ' spin' : ''); b.lastElementChild.textContent = s.refreshing ? 'Synchronisation en cours…' : LABEL[s.state] + (s.lastSync ? ` · ${ago(s.lastSync)} (${new Date(s.lastSync).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })})` : '');
  $('#actions').innerHTML = (s.publicUrl ? `<a class="btn primary" href="${esc(s.publicUrl)}" target="_blank" rel="noopener">🌐 Ouvrir le site public</a><button class="btn" id="cp">📋 Copier le lien</button>` : '<span class="btn" style="cursor:default">🔒 Pas de lien public — renseignez la clé Tailscale</span>') +
    `<button class="btn" id="rf" ${s.refreshing ? 'disabled' : ''}>🔄 Synchroniser maintenant</button><button class="btn" id="cr" ${s.sheets.crawling ? 'disabled' : ''}>📄 Relire les feuilles de match</button>`;
  if (s.publicUrl) $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(s.publicUrl); $('#cp').textContent = '✅ Copié'; } catch { prompt('Lien', s.publicUrl); } };
  $('#rf').onclick = () => post('refresh'); $('#cr').onclick = () => post('crawl');
  const c = s.counts || {}, pct = s.sheets.total ? Math.round(100 * s.sheets.sheets / s.sheets.total) : 0;
  $('#tiles').innerHTML = [[c.matches ?? '—', 'matchs de la saison'], [c.played ?? '—', 'matchs joués'], [c.comps ?? '—', 'compétitions'], [c.teams ?? '—', 'équipes'], [c.clubs ?? '—', 'clubs'], [s.sheets.players, 'joueurs indexés']].map(([n, l]) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`).join('');
  const hist = s.refreshes.length ? `<table><tr><th>Quand</th><th>Durée</th><th>Résultat</th><th>Scores</th></tr>${s.refreshes.map((r) => `<tr><td>${dt(r.at)}</td><td>${(r.ms / 1000).toFixed(1)} s</td><td>${r.ok ? '<span class="dot"></span>OK' : '<span class="dot bad"></span>' + esc(r.error)}</td><td>${r.ok ? (r.changed ? '+' + r.changed : '—') : ''}</td></tr>`).join('')}</table>` : '<div class="empty">Aucune synchronisation depuis le démarrage.</div>';
  $('#cols').innerHTML = `
  <div class="card"><h2>Synchronisation avec la FFH</h2>
    ${row('Dernière synchro', `${ago(s.lastSync)} <span class="muted small">(${dt(s.lastSync)})</span>`)}
    ${row('Prochaine', `${ago(s.nextSync)}`)}
    ${row('Identité des appels', `<code style="font-size:12px;word-break:break-all">${esc(s.ua || '—')}</code>`)}
    ${row('Fréquence', `${{ live: '🟢 match en cours', soon: '🟡 match dans moins de 3 h', today: '🟡 match dans les 24 h', idle: '⚪ aucun match proche' }[s.syncMode] || 'adaptative'} · toutes les ${Math.round((s.syncDelayMs || s.refreshMs) / 60000)} min`)}
    ${row('API résultats', ms(s.probe.api))}
    ${row('Site ffhockey.org (actus)', ms(s.probe.site))}
    ${row('Actualités', s.news ? `${s.news.ok ? '<span class="dot"></span>' + s.news.count + ' articles' : '<span class="dot bad"></span>échec'} · ${ago(s.news.at)}` : '<span class="muted">pas encore chargées</span>')}
  </div>
  <div class="card"><h2>Feuilles de match & joueurs</h2>
    ${row('Feuilles lues', `${s.sheets.sheets} / ${s.sheets.total}`)}
    <div class="bar"><div style="width:${pct}%"></div></div><div class="small muted">${pct}% ${s.sheets.crawling ? '· collecte en cours…' : ''} ${s.sheets.includeYouth ? '(jeunes inclus)' : '(catégories de jeunes exclues)'}</div>
    ${row('Joueurs indexés', s.sheets.players)}
  </div>
  <div class="card"><h2>Notifications push</h2>
    ${row('Appareils abonnés', s.push.subscribers)}
    ${row('…avec des équipes favorites', s.push.withFavs)}
    ${row('Notifications envoyées', s.push.sent)}
    ${row('Échecs', s.push.failed)}
    ${row('Dernier envoi', s.push.lastAt ? `${ago(s.push.lastAt)} (HTTP ${s.push.lastStatus})` : '—')}
  </div>
  <div class="card"><h2>Liens utiles</h2>
    ${row('Site public', s.publicUrl ? `<a class="link" href="${esc(s.publicUrl)}" target="_blank" rel="noopener">${esc(s.publicUrl.replace(/^https:\/\//, ''))}</a>` : '—')}
    ${row('Résultats FFH (source)', '<a class="link" href="https://championnats.ffhockey.org/" target="_blank" rel="noopener">championnats.ffhockey.org</a>')}
    ${row('Site de la fédération', '<a class="link" href="https://www.ffhockey.org/" target="_blank" rel="noopener">ffhockey.org</a>')}
    ${row('Code source', '<a class="link" href="https://github.com/mmourcia/ha-hockey-ffh" target="_blank" rel="noopener">github.com/mmourcia/ha-hockey-ffh</a>')}
  </div>
  <div class="card full"><h2>Derniers scores détectés</h2>${s.changes.length ? `<table>${s.changes.map((x) => `<tr><td style="width:150px">${dt(x.at)}</td><td><b>${x.id && s.publicUrl ? `<a class="link" href="${esc(s.publicUrl.replace(/\/$/, ''))}/#/match/${esc(x.id)}" target="_blank" rel="noopener">${esc(x.match)} ↗</a>` : esc(x.match)}</b></td><td class="muted">${esc(x.comp || '')}</td></tr>`).join('')}</table>` : '<div class="empty">Aucun nouveau score détecté depuis le démarrage (les nouveaux résultats apparaîtront ici et déclenchent les notifications).</div>'}</div>
  <div class="card full"><h2>Historique des synchronisations</h2>${hist}</div>
  ${s.errors.length ? `<div class="card full"><h2>Erreurs récentes</h2><table>${s.errors.map((x) => `<tr><td style="width:150px">${dt(x.at)}</td><td>${esc(x.msg)}</td></tr>`).join('')}</table></div>` : ''}`;
}
load(); setInterval(load, 10000);
let tab = 'state';
document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b)); $('#pState').hidden = tab !== 'state'; $('#pUsage').hidden = tab !== 'usage'; $('#pLive').hidden = tab !== 'live'; if (tab === 'usage') loadUsage(); if (tab === 'live') loadLive(); }));
const mmss = (s) => s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
const SECT = { home: 'Accueil', matchs: 'Matchs', comps: 'Classements', comp: 'Compétition', buteurs: 'Buteurs', joueurs: 'Joueurs', joueur: 'Fiche joueur', arbitres: 'Arbitres', arbitre: 'Fiche arbitre', equipes: 'Équipes', equipe: 'Fiche équipe', club: 'Club', match: 'Feuille de match', actus: 'Actus', search: 'Recherche' };
async function loadLive() {
  let n; try { n = await (await fetch(base + 'livenotes', { cache: 'no-store' })).json(); } catch { $('#pLive').innerHTML = '<div class="empty">Indisponible.</div>'; return; }
  $('#pLive').innerHTML = `<div class="card full"><h2>Commentaires saisis par les spectateurs</h2><p class="muted small">Visibles publiquement sur la fiche du match. Supprimez tout contenu inapproprié. Les liens sont déjà refusés automatiquement.</p>${n.length ? `<table><tr><th>Quand</th><th>Match</th><th>Saisisseur</th><th>Commentaire</th><th></th></tr>${n.map((x) => `<tr><td style="width:130px">${dt(new Date(x.t).toISOString())}</td><td>${esc(x.match)}</td><td class="muted">${esc(x.who)}…</td><td>${esc(x.txt)}</td><td><button class="tab" data-del="${esc(x.match)}|${esc(x.id)}">Supprimer</button></td></tr>`).join('')}</table>` : '<div class="empty">Aucun commentaire.</div>'}</div>`;
  $('#pLive').querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => { const [m, id] = b.dataset.del.split('|'); await fetch(base + 'livenotes/delete', { method: 'POST', body: JSON.stringify({ match: m, id }) }); loadLive(); }));
}
setInterval(() => { if (tab === 'live') loadLive(); }, 15000);
async function loadUsage() {
  let u; try { u = await (await fetch(base + 'usage', { cache: 'no-store' })).json(); } catch { $('#pUsage').innerHTML = '<div class="empty">Statistiques indisponibles.</div>'; return; }
  const max = Math.max(1, ...u.series.map((d) => d.views));
  $('#pUsage').innerHTML = `
  <div class="grid" style="margin-top:12px">
    <div class="tile"><b class="${u.online ? 'live' : ''}">${u.online}</b><span>en ligne maintenant</span></div>
    <div class="tile"><b>${u.visitors.today}</b><span>visiteurs aujourd’hui</span></div>
    <div class="tile"><b>${u.visitors.week}</b><span>visiteurs sur 7 jours</span></div>
    <div class="tile"><b>${u.visitors.total}</b><span>visiteurs distincts (total)</span></div>
    <div class="tile"><b>${u.views.week}</b><span>pages vues sur 7 jours</span></div>
    <div class="tile"><b>${mmss(u.avgSessionSec)}</b><span>durée moyenne d’une visite (30 j)</span></div>
    <div class="tile"><b>${u.pwaShare}%</b><span>ont installé l’app</span></div>
    <div class="tile"><b>${u.mobileShare}%</b><span>sur mobile</span></div>
  </div>
  <div class="cols">
    <div class="card full"><h2>Pages vues – 14 derniers jours</h2><div class="spark">${u.series.map((d) => `<div title="${d.day} : ${d.views} pages, ${d.visitors} visiteurs" style="height:${Math.round(100 * d.views / max)}%"></div>`).join('')}</div><div class="spark-l">${u.series.map((d) => `<span>${d.day.slice(8)}</span>`).join('')}</div></div>
    <div class="card"><h2>Rubriques les plus vues</h2>${u.pages.length ? `<table><tr><th>Rubrique</th><th>Vues</th><th>Temps</th></tr>${u.pages.map((p) => `<tr><td>${esc(SECT[p.page] || p.page)}</td><td>${p.views}</td><td>${dur(p.seconds)}</td></tr>`).join('')}</table>` : '<div class="empty">Pas encore de données.</div>'}</div>
    <div class="card"><h2>Pages précises les plus vues</h2>${u.objects.length ? `<table><tr><th>Page</th><th>Vues</th><th>Temps</th></tr>${u.objects.map((p) => `<tr><td>${esc(p.label)}</td><td>${p.views}</td><td>${dur(p.seconds)}</td></tr>`).join('')}</table>` : '<div class="empty">Pas encore de données.</div>'}</div>
    <div class="card"><h2>Équipes les plus mises en favori</h2>${u.favTeams.length ? `<table><tr><th>Équipe</th><th>Visiteurs</th></tr>${u.favTeams.map((t) => `<tr><td>⭐ ${esc(t.label)}</td><td>${t.visitors}</td></tr>`).join('')}</table>` : '<div class="empty">Aucun favori pour le moment.</div>'}</div>
    <div class="card"><h2>Appareils</h2>${u.devices.length ? `<table>${u.devices.map((d) => `<tr><td>${esc(d.label)}</td><td>${d.n}</td></tr>`).join('')}</table>` : '<div class="empty">—</div>'}</div>
    <div class="card full"><h2>Qui accède (visiteurs anonymes)</h2>${u.people.length ? `<table><tr><th>Visiteur</th><th>Dernière visite</th><th>Visites</th><th>Pages</th><th>Temps total</th><th>Appareil</th><th>Équipes favorites</th></tr>${u.people.map((p) => `<tr><td>${p.online ? '<span class="live">● </span>' : ''}${esc(p.label)}${p.pwa ? ' <span class="pill">app</span>' : ''}</td><td>${ago(new Date(p.last).toISOString())}</td><td>${p.visits}</td><td>${p.views}</td><td>${dur(p.seconds)}</td><td>${esc(p.device)}</td><td>${p.favs.map((f) => `<span class="pill">${esc(f)}</span>`).join('') || '<span class="muted">—</span>'}</td></tr>`).join('')}</table>` : '<div class="empty">Personne n’a encore ouvert le site.</div>'}</div>
    <div class="card full"><h2>Derniers ajouts / retraits de favoris</h2>${u.favLog.length ? `<table>${u.favLog.map((e) => `<tr><td style="width:150px">${dt(new Date(e.at).toISOString())}</td><td>${esc(e.who)}</td><td>${e.on ? '⭐ a ajouté' : '☆ a retiré'}</td><td>${esc(e.team)}</td></tr>`).join('')}</table>` : '<div class="empty">Aucun mouvement.</div>'}</div>
  </div>
  <p class="muted small" style="margin-top:12px">Mesure anonyme : un identifiant aléatoire par navigateur, sans nom, e-mail ni adresse IP. Les visiteurs ayant activé « Ne pas suivre » ne sont pas comptés. Les « visiteurs » sont des navigateurs, pas des personnes : une même personne sur deux appareils compte deux fois. Données conservées 180 jours.</p>`;
}
setInterval(() => { if (tab === 'usage') loadUsage(); }, 15000);

</script>
</body>
</html>
