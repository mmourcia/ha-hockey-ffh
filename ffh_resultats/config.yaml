name: "Hockey FFH Résultats"
version: "1.13.1"
slug: ffh_resultats
url: "https://github.com/mmourcia/ha-hockey-ffh"
description: "PWA de résultats de la Fédération Française de Hockey (API FFH, Web Push)"
arch: [amd64, aarch64, armv7]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8100
panel_icon: mdi:hockey-sticks
panel_title: Hockey FFH
panel_admin: false
ports:
  8080/tcp: 8099
ports_description:
  8080/tcp: "Interface web (proxifiable par Tailscale Funnel)"
options:
  vapid_subject: "mailto:contact@example.org"
  refresh_minutes: 5
  tailscale_hostname: hockey
  include_youth_players: false
schema:
  vapid_subject: str
  refresh_minutes: int(1,60)
  tailscale_authkey: password?
  tailscale_hostname: str
  include_youth_players: bool
